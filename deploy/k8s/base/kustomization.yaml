apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The service, not an environment: no namespace, replica count, image tag or
# ingress host. Applying the base alone is not supported.

resources:
  - namespace-limits.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-ingress.yaml
  - redis-deployment.yaml
  - redis-service.yaml

configMapGenerator:
  - name: api-config
    literals:
      # The artifact arrives on a mounted volume, not in the image.
      - CS_MODEL_PATH=/models/pipeline.joblib
      - CS_CACHE_TTL_SECONDS=300
