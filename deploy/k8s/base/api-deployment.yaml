apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  # No replicas: the HPA owns it, and declaring both fights it on every apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Long enough to finish in-flight scores.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: credit-scoring/api
          # The image is side-loaded; there is no registry to pull from.
          # Already the default for a tagged image, kept so that a `:latest`
          # tag, whose default is `Always`, cannot re-enable pulling.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: REDIS_PASSWORD
            # $(VAR) is expanded by Kubernetes against this container's own
            # env, so the password has one source: the Secret.
            - name: CS_REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Startup holds the other two off during the model load. Readiness
          # takes a wedged pod out of the Service; liveness restarts it, which
          # costs another model load, so it is the slowest to fire. /health
          # answers only once `lifespan` has loaded the artifact.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 40 # ~2 min for a cold model load
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - name: model-artifact
              mountPath: /models
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # hostPath, not a PVC: the artifact is produced on this machine and
        # sync-artifact.sh puts it on the node. fsGroup does not apply to
        # hostPath, which is why that script chmods the file instead.
        - name: model-artifact
          hostPath:
            path: /opt/credit-scoring/models
            type: Directory
