# Namespaced by whichever overlay includes them, so an overlay only declares
# its Namespace object. Sized from the base's limits, not any overlay's.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
spec:
  hard:
    # maxReplicas 4 + maxSurge 1 = 5 api pods at the base's 1 CPU / 1Gi, plus
    # Redis: 5.5 CPU and 5.25Gi. Sizing for 4 instead kills a rollout at full
    # scale with a FailedCreate that names the quota, not the autoscaler.
    limits.cpu: "6"
    limits.memory: 6Gi
    requests.cpu: "1"
    requests.memory: 3Gi
    pods: "12"
    count/deployments.apps: "5"
    count/services: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-limits
spec:
  limits:
    # A quota on requests rejects any pod that declares none, so a bare
    # `kubectl run` needs these defaults to schedule at all.
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 1Gi
