apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: credit-dev

resources:
  - namespace.yaml
  - ../../base

images:
  - name: credit-scoring/api
    newTag: dev

secretGenerator:
  # secret.env is gitignored and generated by deploy.sh on first run;
  # secret.env.example documents the keys.
  - name: api-secrets
    envs:
      - secret.env

patches:
  - path: ingress-host.yaml
  - path: api-dev-resources.yaml
