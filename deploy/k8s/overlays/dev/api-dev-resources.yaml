# What fits on a laptop that is also running Docker Desktop, the ingress
# controller and metrics-server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 768Mi
