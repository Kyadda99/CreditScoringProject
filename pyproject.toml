[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "0.0.0"
description = "Credit default scoring, end-to-end: data -> model -> service -> cloud"
readme = "README.md"
requires-python = ">=3.12"
# Only what serving needs; every entry here ships in the container image.
# mlflow and kagglehub sit in the `training` group below: adding them took the
# image from ~520 MB to 1.28 GB, and the service does not use them.
dependencies = [
    "pandas>=2.2",
    # kagglehub reads credentials from the environment but not from `.env`.
    # pydantic-settings pulls this library in anyway.
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # Runtime, even though api/app.py never imports it: the champion is an
    # XGBClassifier, so joblib loads xgboost.sklearn when unpickling the
    # artifact. Without it the container starts and then fails in `lifespan`.
    # If the champion stops being XGBoost, this moves back to `training`.
    "xgboost>=3.4.1",
    "redis>=5.0",
]

[project.scripts]
# Runnable commands: a thin `main()` in a module under src/, invoked by
# `uv run <name>`.
cs-download = "download_data:main"
cs-train = "train:cli"
cs-tune = "tune:cli"
cs-export = "registry:cli"
cs-serve = "api.app:main"

[dependency-groups]
# Dev-only tooling. uv installs these by default with `uv sync`;
# CI uses the same groups so local and CI runs cannot drift.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "black>=24.10",
    "httpx>=0.27",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pytest-cov>=7.1.0",
    "fakeredis>=2.26",
    "pytest-asyncio>=0.24",
    # The manifest tests parse what `kubectl kustomize` renders.
    "pyyaml>=6.0",
]

# The load generator. Kept out of `dev` because it is only ever run by hand
# against a running cluster, and it is not small.
load = [
    "locust>=2.32",
]

# Needed offline only: training and downloading data. The container image
# installs with `uv sync --no-default-groups`, so it does not get these.
training = [
    "mlflow>=2.16",
    "kagglehub>=1.0.1",
    "imbalanced-learn>=0.14.2",
    "optuna>=4.9.0",
    "optuna-integration[mlflow]>=4.9.0",
    "prefect>=3.8.7",
]

# Locally we want both: dev for tests, training for cs-train and cs-download.
# The container image deliberately skips both.
[tool.uv]
default-groups = ["dev", "training"]
# On Linux XGBoost pulls in `nvidia-nccl-cu13`, 288 MB of CUDA libraries for
# collective communication between GPUs. The scoring service handles one row on
# CPU and never sees a GPU, and the image grew from 700 MB to 1.4 GB because of
# it. The marker `sys_platform == 'never'` matches no platform, so the package
# installs nowhere.
#
# Training XGBoost on a GPU would require removing this override.
override-dependencies = ["nvidia-nccl-cu13; sys_platform == 'never'"]

# Flat modules live directly under src/ and are imported by bare name
# (`from config import TARGET`). Add one entry here per module as each
# phase introduces it.
#
# Verified with setuptools 80.x: a name listed here that is not on disk is
# silently skipped and the build still succeeds. This list does not police
# itself; delete a module and the wheel quietly loses it. The real guard is
# tests/test_api.py importing through the installed package.
[tool.setuptools]
py-modules = ["config", "data", "download_data", "preprocessing", "strategies", "preprocessor", "data_loader", "trainer", "predictor", "settings", "flows", "evaluation", "artifact", "train", "eda", "quality_gate", "registry", "tune"]

# Sub-packages under src/, such as api/ and features/.
[tool.setuptools.packages.find]
where = ["src"]

# feature_schema.json is generated by training and committed. It must reach the
# installed package because api/schemas.py reads it at import; otherwise the
# container image starts without a feature contract.
[tool.setuptools.package-data]
api = ["feature_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "requires_data: needs data/raw/application_train.csv on disk; skipped in CI",
    "integration: needs a running compose stack; deselected in CI",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade,
# B bugbear, ANN missing annotations, D pydocstyle (Google).
select = ["E", "W", "F", "I", "UP", "B", "ANN", "D"]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; full docstrings there are noise.
"tests/*" = ["D100", "D103", "ANN201"]
