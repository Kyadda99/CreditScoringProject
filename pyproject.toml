[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-scoring"
version = "0.0.0"
description = "Credit default scoring, end-to-end: data -> model -> service -> cloud"
readme = "README.md"
requires-python = ">=3.12"
# Wyłącznie to, czego potrzebuje SERWOWANIE — każda pozycja tutaj ląduje
# w obrazie kontenera. mlflow i kagglehub siedzą w grupie `training` niżej:
# dorzucone do obrazu podniosły go z ~520 MB do 1.28 GB, a serwis ich nie używa.
dependencies = [
    "pandas>=2.2",
    # kagglehub czyta poświadczenia ze środowiska, ale nie z `.env`.
    # pydantic-settings w Fazie 1 i tak ciągnie tę bibliotekę pod spodem.
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # RUNTIME, choć api/app.py nigdy go nie importuje: championem Fazy 3 jest
    # XGBClassifier, więc joblib ładuje xgboost.sklearn przy odpakowywaniu
    # artefaktu. Bez tego kontener wstaje i pada dopiero w `lifespan`.
    # Gdyby champion kiedyś przestał być XGBoostem, ta pozycja wraca do grupy
    # `training` — obraz ma płacić wyłącznie za to, co faktycznie wozi.
    "xgboost>=3.4.1",
]

[project.scripts]
# Uruchamialne polecenia, zgodnie z CLAUDE.md: cienki `main()` w module
# pod src/, wywoływany przez `uv run <nazwa>`.
cs-download = "download_data:main"
cs-train = "train:cli"
cs-tune = "tune:cli"
cs-export = "registry:cli"
cs-serve = "api.app:main"

[dependency-groups]
# Dev-only tooling. uv installs these by default with `uv sync`;
# CI uses the same groups so local and CI runs cannot drift.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "black>=24.10",
    "httpx>=0.27",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pytest-cov>=7.1.0",
]

# Potrzebne wyłącznie offline: trening i pobieranie danych. Obraz kontenera
# instaluje się przez `uv sync --no-default-groups`, więc tego nie dostaje.
training = [
    "mlflow>=2.16",
    "kagglehub>=1.0.1",
    "imbalanced-learn>=0.14.2",
    "optuna>=4.9.0",
    "optuna-integration[mlflow]>=4.9.0",
    "prefect>=3.8.7",
]

# Lokalnie chcemy komplet: dev do testów, training do `cs-train` i `cs-download`.
# Obraz kontenera świadomie omija oba.
[tool.uv]
default-groups = ["dev", "training"]
# XGBoost na Linuksie ciągnie `nvidia-nccl-cu13` — 288 MB bibliotek CUDA do
# komunikacji zbiorowej między GPU. Serwis scoringowy liczy JEDEN wiersz na
# CPU i nigdy nie zobaczy karty graficznej, więc to czysty balast: obraz rósł
# przez to z 700 MB do 1.4 GB. Marker `sys_platform == 'never'` nie pasuje do
# żadnej platformy, więc pakiet nie instaluje się nigdzie.
#
# Gdyby Faza 4 chciała trenować XGBoosta na GPU, ten override trzeba zdjąć
# — ale wtedy i tak wraca do grupy `training`, nie do obrazu.
override-dependencies = ["nvidia-nccl-cu13; sys_platform == 'never'"]

# Flat modules live directly under src/ and are imported by bare name
# (`from config import TARGET`). Add one entry here per module as each
# phase introduces it.
#
# WARNING (verified 2026-09-04, setuptools 80.x): a name listed here that is
# NOT on disk is **silently skipped** — the build still succeeds. An earlier
# version of this comment claimed the opposite. So this list does not police
# itself: delete a module and the wheel just quietly loses it, exactly the
# kind of silent drift that bit us in Phase 1 (M1/M4). The real guard is
# tests/test_api.py importing through the installed package.
[tool.setuptools]
py-modules = ["config", "data", "download_data", "preprocessing", "strategies", "preprocessor", "data_loader", "trainer", "predictor", "settings", "flows", "evaluation", "artifact", "train", "eda", "quality_gate", "registry", "tune"]

# Sub-packages under src/ (api/, features/, nn/) arrive in later phases.
[tool.setuptools.packages.find]
where = ["src"]

# feature_schema.json jest generowany przez trening i commitowany. Musi trafić
# do zainstalowanego pakietu, bo api/schemas.py czyta go przy imporcie — inaczej
# obraz kontenera wstaje bez kontraktu cech.
[tool.setuptools.package-data]
api = ["feature_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_data: needs data/raw/application_train.csv on disk; skipped in CI",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade,
# B bugbear, ANN missing annotations, D pydocstyle (Google).
select = ["E", "W", "F", "I", "UP", "B", "ANN", "D"]
ignore = [
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; full docstrings there are noise.
"tests/*" = ["D100", "D103", "ANN201"]
