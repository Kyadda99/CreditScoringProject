name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to the same branch cancels the previous run. Not on `main`,
# where every commit must have its own settled result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Enforces that uv.lock is current with pyproject.toml: any uv call,
      # including the implicit sync in `uv run`, fails if the lock would
      # change. `--frozen` does not do this; it only skips updating the lock,
      # so a pyproject/lock drift would pass unnoticed.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      # The Home Credit dataset needs Kaggle credentials and weighs ~160 MB,
      # so CI does not download it. Tests marked `requires_data` skip
      # themselves; the rest must pass.
      - name: Pytest
        run: uv run pytest -m "not integration"
