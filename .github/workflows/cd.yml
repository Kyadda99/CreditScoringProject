name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_smoke_failure:
        description: Point the tagged-revision smoke test at a missing path
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    # The branch filter alone also matches a pull request from a fork's `main`.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGION: europe-central2
      SERVICE: credit-scoring-api
      IMAGE_REPO: europe-central2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/credit-scoring/api
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # A scaled-to-zero revision answers only after its first container starts.
      SMOKE_TIMEOUT: "180"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # A re-run of an older CI or CD run would otherwise deploy that older
      # commit over a newer one.
      - name: Refuse a commit that is not the tip of main
        run: |
          git fetch --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$SHA" ]; then
            echo "::error::$SHA is not the tip of main ($tip); not deploying it"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: serve
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.SHA }}
          cache-from: type=gha,scope=serve

      - name: Deploy a tagged revision
        id: deploy
        env:
          CS_GCP_REGION: ${{ env.REGION }}
          CS_RUN_SERVICE: ${{ env.SERVICE }}
          CS_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          CS_MODEL_BUCKET: ${{ vars.GCS_MODEL_BUCKET }}
        run: deploy/cloudrun/deploy.sh "${IMAGE_REPO}:${SHA}" "sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the tagged revision
        env:
          TAG_URL: ${{ steps.deploy.outputs.url }}
          SUFFIX: ${{ inputs.force_smoke_failure && '/force-failure' || '' }}
        run: deploy/k8s/smoke.sh "${TAG_URL}${SUFFIX}"

      - name: Move traffic to the revision
        env:
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: >-
          gcloud run services update-traffic "$SERVICE" --region "$REGION"
          --to-revisions "${REVISION}=100"

      - name: Smoke-test the public URL
        run: |
          url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          deploy/k8s/smoke.sh "$url"

      - name: Traffic split
        if: always() && steps.auth.outcome == 'success'
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format='yaml(status.traffic)'
